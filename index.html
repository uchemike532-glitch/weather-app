<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Weather</h1>
    <p class="subtitle">Search any city for current conditions and a 3-day forecast.</p>

    <form id="search-form">
      <input id="city" type="text" placeholder="e.g. Lagos, London, Tokyo" autocomplete="off" required />
      <button type="submit">Search</button>
    </form>

    <div id="result"></div>
  </main>
   <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
